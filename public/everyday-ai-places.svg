</g>
<rect x="210" y="840" width="980" height="38" rx="19" fill="#ffe58c"/><text x="700" y="866" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#24486b">AI is a tool people build. It can help, but it can also make mistakes.</text>
