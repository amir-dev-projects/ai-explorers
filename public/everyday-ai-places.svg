<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
<title id="title">Everyday places where we see AI</title><desc id="desc">Five illustrated panels show examples of AI at home, in cars, at school, in libraries and in supermarkets.</desc>
<defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#eff8ff"/><stop offset="1" stop-color="#e2f0fb"/></linearGradient><linearGradient id="blue" x2="1" y2="1"><stop stop-color="#258bd0"/><stop offset="1" stop-color="#1760a3"/></linearGradient></defs>
<rect width="1400" height="900" rx="34" fill="url(#bg)"/>
<text x="700" y="72" text-anchor="middle" font-family="Arial,sans-serif" font-size="43" font-weight="800" fill="#173b63">Everyday Places Where We See AI</text>
<text x="700" y="112" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#496783">AI can help with learning, finding things, staying safe and saving time.</text>
