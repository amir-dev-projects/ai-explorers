name: Build

on:
  push:
    branches:
      - main
      - feat/ai-explorers-first-build
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build app
        run: npm run build
